# Default delegate profiles for auto-bmad.
#
# Each profile carries:
#   * tool-neutral persona strings (description / role_blurb / status_example),
#     used to render the SAME wording into both Claude and Codex agent files —
#     this is where every per-profile difference lives, so Claude vs Codex
#     output cannot drift;
#   * per-tool model + effort, used to fill in the tool-native frontmatter.
#
# `scripts/render-agents.py` reads this file (or the `profiles:` block of the
# runtime config) and writes the tool-native delegate definitions from ONE
# shared body template per tool:
#   - Claude Code -> .claude/agents/<name>.md    (frontmatter `model:` / `effort:`)
#   - Codex       -> .codex/agents/<name>.toml   (`model` / `model_reasoning_effort`)
#
# To retune: copy this block into {output_folder}/auto-bmad/config.yaml, edit it,
# and run `/auto-bmad reprovision`. Keep the BLOCK style shown here (two-space
# nesting) — the renderer's dependency-free parser expects it.
#
# Codex reasoning effort (gpt-5.x) is one of: low | medium | high | xhigh — xhigh
# is the ceiling (older GPT-5 also exposed minimal/none). Claude effort is one of:
# low | medium | high | xhigh | max (set via the sub-agent `effort:` frontmatter).
# Model names are environment-specific — retune above if your Codex install differs.
profiles:
  ab-max:
    description: "auto-bmad delegate for the HIGHEST-stakes steps (story implementation and applying code-review fixes). Invoked by the auto-bmad orchestrator; not meant for direct use."
    role_blurb: "the highest-stakes work: implementing story code and applying code-review fixes. Correctness matters more than speed — reason hard about edge cases, regressions, and acceptance criteria."
    status_example: "any status/state the skill set (e.g. story moved to `review`), test results"
    claude:
      model: opus
      effort: max
    codex:
      model: gpt-5.5
      reasoning_effort: xhigh

  ab-xhigh:
    description: "auto-bmad delegate for high-stakes analysis steps (creating the story context file, and adversarial code review on the high-effort reviewer iterations). Invoked by the auto-bmad orchestrator; not meant for direct use."
    role_blurb: "high-stakes analysis: building the comprehensive story context file (`create-story`) and running adversarial code review on the high-effort reviewer iterations. Be exhaustive and skeptical — these steps determine whether everything downstream succeeds."
    status_example: "for reviews — the review verdict (Approve / Changes Requested / Blocked) and Critical/High/Med/Low finding counts; for create-story — the story key, path, and final status"
    claude:
      model: opus
      effort: xhigh
    codex:
      model: gpt-5.5
      reasoning_effort: xhigh

  ab-high:
    description: "auto-bmad delegate for epic-boundary steps (epic-level test design, release gates trace/nfr/test-review, and the epic retrospective). Invoked by the auto-bmad orchestrator; not meant for direct use."
    role_blurb: "epic-boundary work: epic-level test design, release-gate skills (trace / NFR / test-review), and the epic retrospective. These are judgment-heavy synthesis tasks — answer every interactive prompt yourself using the provided context and sensible judgment, and produce the complete output document."
    status_example: "for gate skills — the gate decision (PASS / CONCERNS / FAIL / WAIVED) and rationale; for the retrospective — key action items and any next-epic prep flagged"
    claude:
      model: opus
      effort: high
    codex:
      model: gpt-5.5
      reasoning_effort: high

  ab-alt:
    description: "auto-bmad delegate for lower-stakes mechanical steps (story triage, ATDD scaffolds, test automation, project-context updates, and the faster-model code-review iterations). Invoked by the auto-bmad orchestrator; not meant for direct use."
    role_blurb: "the lower-stakes, mechanical, or well-scoped work: story triage, ATDD scaffolds, test automation, updating project context, and the faster-model code-review iterations."
    status_example: "tests passing? coverage added? PR opened/draft?"
    claude:
      model: sonnet
      effort: high
    codex:
      model: gpt-5.4
      reasoning_effort: high

# Phase -> profile mapping. This is the SINGLE source of the phase->profile
# binding: pipeline.md / delegation.md name these keys, never raw profile names.
# `render-agents.py` only reads the `profiles:` block above and ignores this one
# (its parser stops at the next top-level key), so editing here is renderer-safe.
# Copied alongside `profiles` into config.yaml at first run; retune there.
phase_profiles:
  create_story: ab-xhigh
  dev_story: ab-max
  code_review_review: ab-xhigh           # primary reviewer (odd iterations)
  code_review_review_secondary: ab-alt   # even iterations, when code_review.alternate_models
  code_review_fix: ab-xhigh
  tea_per_story: ab-high                 # Phase 0 triage, Phase 4 ATDD, Phase 6 automate
  tea_epic: ab-xhigh                     # Phase 2 epic test design, Phase 8 epic gates
  retrospective: ab-alt
  project_context: ab-alt
