# Default delegate profiles for auto-bmad.
#
# Each profile carries:
#   * tool-neutral persona strings (description / role_blurb / status_example),
#     used to render the SAME wording into both Claude and Codex agent files —
#     this is where every per-profile difference lives, so Claude vs Codex
#     output cannot drift;
#   * per-tool model + effort, used to fill in the tool-native frontmatter.
#
# `scripts/render-agents.py` reads this file (or the `profiles:` block of the
# runtime config) and writes the tool-native delegate definitions from ONE
# shared body template per tool:
#   - Claude Code -> .claude/agents/<name>.md    (frontmatter `model:` / `effort:`)
#   - Codex       -> .codex/agents/<name>.toml   (`model` / `model_reasoning_effort`)
#
# To retune: copy this block into {output_folder}/auto-bmad/config.yaml, edit it,
# and run `/auto-bmad reprovision`. Keep the BLOCK style shown here (two-space
# nesting) — the renderer's dependency-free parser expects it.
#
# Codex reasoning effort (gpt-5.x) is one of: low | medium | high | xhigh — xhigh
# is the ceiling (older GPT-5 also exposed minimal/none). Claude effort is one of:
# low | medium | high | xhigh | max (set via the sub-agent `effort:` frontmatter).
# Model names are environment-specific — retune above if your Codex install differs.
profiles:
  ab-max:
    description: "auto-bmad delegate for the HIGHEST-stakes step: implementing story code (`dev-story`). Invoked by the auto-bmad orchestrator; not meant for direct use."
    role_blurb: "the highest-stakes work: implementing story code in the `dev-story` phase. Correctness matters more than speed — reason hard about edge cases, regressions, and acceptance criteria."
    status_example: "any status/state the skill set (e.g. story moved to `review`), test results"
    claude:
      model: opus
      effort: max
    codex:
      model: gpt-5.5
      reasoning_effort: xhigh

  ab-xhigh:
    description: "auto-bmad delegate for deep-reasoning, high-stakes steps: building the story context file (`create-story`), primary adversarial code review and applying the resulting fixes, and the epic-level test design + release gates (trace/NFR/test-review). Invoked by the auto-bmad orchestrator; not meant for direct use."
    role_blurb: "the deep-reasoning, high-stakes work: building the comprehensive story context file (`create-story`), running adversarial primary code review and applying the resulting fixes, and the epic-level test design + release gates (trace / NFR / test-review). Be exhaustive and skeptical — these steps determine whether everything downstream succeeds, and the gates decide whether the epic ships."
    status_example: "for create-story — the story key, path, and final status; for reviews — the verdict (Approve / Changes Requested / Blocked) and Critical/High/Med/Low finding counts; for fixes — which findings were resolved; for gate skills — the gate decision (PASS / CONCERNS / FAIL / WAIVED) and rationale"
    claude:
      model: opus
      effort: xhigh
    codex:
      model: gpt-5.5
      reasoning_effort: xhigh

  ab-high:
    description: "auto-bmad delegate for substantive test- and context-infrastructure steps: per-story test authoring (`testarch-atdd` scaffolds, `testarch-automate` coverage), one-time test-framework/CI setup, and building/refreshing `project-context.md`. Invoked by the auto-bmad orchestrator; not meant for direct use."
    role_blurb: "substantive, well-scoped test- and context-infrastructure work: per-story test authoring (ATDD red-phase acceptance scaffolds and expanding automated coverage), the one-time test-framework + CI-pipeline setup, and building or refreshing `project-context.md` — the durable AI-rules doc every later story inherits. These are judgment-heavy — answer every interactive prompt yourself using the provided context and sensible judgment, and produce the complete output document."
    status_example: "for test authoring/setup — tests or framework/CI scaffolded, whether they pass, coverage expanded; for project-context — the file written/refreshed and the key facts captured"
    claude:
      model: opus
      effort: high
    codex:
      model: gpt-5.5
      reasoning_effort: high

  ab-alt:
    description: "auto-bmad delegate for lighter-weight steps: per-story risk triage, the epic retrospective, and the faster-model secondary code-review iterations (for model diversity). Invoked by the auto-bmad orchestrator; not meant for direct use."
    role_blurb: "the lighter-weight or diversity-oriented work: classifying per-story test risk (triage), synthesizing the epic retrospective from accumulated notes, and running the faster-model secondary code-review iterations that give the review loop model diversity."
    status_example: "for triage — the risk level (low/med/high) and selected TEA set; for the retrospective — key action items and any next-epic prep flagged; for secondary review — the verdict and finding counts"
    claude:
      model: sonnet
      effort: high
    codex:
      model: gpt-5.4
      reasoning_effort: high

# Phase -> profile mapping. This is the SINGLE source of the phase->profile
# binding: pipeline.md / delegation.md name these keys, never raw profile names.
# `render-agents.py` only reads the `profiles:` block above and ignores this one
# (its parser stops at the next top-level key), so editing here is renderer-safe.
# Copied alongside `profiles` into config.yaml at first run; retune there.
phase_profiles:
  create_story: ab-xhigh
  dev_story: ab-max
  code_review_review: ab-xhigh           # primary reviewer (odd iterations)
  code_review_review_secondary: ab-alt   # even iterations, when code_review.alternate_models
  code_review_fix: ab-xhigh
  tea_triage: ab-alt                     # Phase 0 story-risk classification (cheap)
  tea_per_story: ab-high                 # Phase 4 ATDD, Phase 6 automate
  tea_epic: ab-xhigh                     # Phase 2 epic test design, Phase 8 epic gates
  retrospective: ab-alt
  project_context: ab-high               # Phase 2 bootstrap + Phase 8 refresh
